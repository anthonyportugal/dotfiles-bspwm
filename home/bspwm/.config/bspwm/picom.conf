###############################################################################
# Picom Compositor Configuration
# Tailored for BSPWM and Catppuccin Mocha
###############################################################################

# Backend & Rendering
backend = "glx";
vsync = true;
use-damage = true;

# Rounded Corners
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'desktop'",
  "class_g ?= 'rofi'",
  "class_g ?= 'polybar'",
  "class_g ?= 'tint2'"
];

# Shadows
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.30;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
  "class_g = 'Cairo-clock'",
  "class_g = 'CoverGloobus'",
  "class_g = 'Tilda'",
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g ?= 'Cairo-dock'",
  "class_g ?= 'Xfce4-notifyd'",
  "class_g ?= 'Xfce4-power-manager'",
  "_GTK_FRAME_EXTENTS@",
  "_NET_WM_STATE@ *= '_NET_WM_STATE_HIDDEN'"
];

# Fading Transitions
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;
fade-exclude = [
  "class_g = 'slop'"
];
no-fading-openclose = false;
no-fading-destroyed-argb = true;

# Opacity Rules
inactive-opacity = 1.0;
frame-opacity = 1.0;
active-opacity = 1.0;
inactive-dim = 0.05;
inactive-dim-fixed = true;

focus-exclude = [
  "class_g = 'Cairo-clock'",
  "class_g = 'Bar'",
  "class_g = 'slop'"
];

opacity-rule = [
  "100:class_g = 'Bar'",
  "100:class_g = 'slop'",
  "100:class_g = 'Alacritty'",
  "100:class_g = 'Polybar'",
  "100:class_g = 'firefox'",
  "100:class_g = 'Brave-browser'"
];

# Background Blur
blur-kern = "3x3box";
blur-background-exclude = [
  "window_type = 'desktop'",
  "class_g = 'Plank'",
  "class_g = 'slop'",
  "_GTK_FRAME_EXTENTS@"
];

# Window Type Settings & Behavior
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
log-level = "warn";

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; };
  popup_menu = { opacity = 1.0; };
  dropdown_menu = { opacity = 1.0; };
  utility = { shadow = false; opacity = 1.0; };
  dock = { shadow = true; clip-shadow-above = true; };
  dnd = { shadow = true; };
};
